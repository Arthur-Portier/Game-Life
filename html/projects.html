<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Life</title>
    <script type="module" src="../js/projects.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <div>
            <h1 id="name"></h1>
            <h2 id="level"></h2>
            <h2 id="xp"></h2>
        </div>
        <button id="new-project">Create new project</button>
        <dialog id="project-dialog">
            <form id="project-form" method="dialog">
            <label>Title <input name="title" required></label>
            <label>Steps <textarea name="steps" required></textarea></label>
            <label>Deadline <input name="due" type="date" required></label>
            <button id="confirm-project-creation" type="submit">Submit</button>
            <button id="cancel-project-creation" type="button">Cancel</button>
            </form>
        </dialog>
        <ul id="projects-steps"></ul>
        <a href="../index.html">Back</a>
    </main>
</body>
</html>
